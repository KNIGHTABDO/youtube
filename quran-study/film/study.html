<!doctype html>
<meta charset="utf-8">
<title>Quran study with me</title>
<style>
  @font-face { font-family: 'Amiri Quran'; src: url(fonts/amiri-quran-arabic-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Amiri'; font-weight: 700; src: url(fonts/amiri-arabic-700-normal.woff2) format('woff2'); unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB50-FDFF, U+FE70-FEFF; }
  @font-face { font-family: 'Amiri'; font-weight: 400; src: url(fonts/amiri-latin-400-normal.woff2) format('woff2'); unicode-range: U+0000-024F, U+2000-206F, U+2190-21FF; }
  @font-face { font-family: 'Amiri'; font-weight: 400; font-style: italic; src: url(fonts/amiri-latin-400-italic.woff2) format('woff2'); unicode-range: U+0000-024F, U+2000-206F; }
  body{margin:0;background:#111;color:#ccc;font:13px/1.4 ui-monospace,Menlo,monospace;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px}
  canvas#c{width:min(96vw,1280px);height:auto;background:#000}

</style>
<canvas id="c"></canvas>
<script src="core.js"></script>
<script src="timeline.js"></script>
<script>
'use strict';
// ============================================================
// STUDY WITH ME — QUR'AN RECITATION (1 hour, Pomodoro 25/5)
// Look: chalk and brush-pen lines on a night-indigo room, watercolour washes, one warm lantern.
// Everything static is drawn once (it draws itself on during the intro, then holds as a single drawing).
// Only things that are alive move: the lantern flame, tea steam, stars, drifting clouds, a sleeping cat's breath,
// the moon crossing the window over the hour, the ayah card and the timer.
// Cadence: 12 drawn frames per second (on twos), packed to 24 fps.
//
// t (video s)       what the viewer sees
// 0 .. intro        the room draws itself, the lantern is lit, the title card writes on
// intro .. +60 min  recitation: each ayah on the card as it is recited; Pomodoro 25/5 on the notebook
// .. end            session complete card
// ============================================================
const ST = window.STUDY;
const INTRO = ST.intro, SESSION = ST.session, OUTRO = ST.outro, S_END = INTRO + SESSION;
const QS = new URLSearchParams(location.search);

const COL = {
  wall: '#282a4b', wallDeep: '#1b1d37', frame: '#35385f', skyTop: '#0b0f2b', skyLow: '#2b3467', city: '#141833',
  chalk: '#f1e8d4', chalkDim: '#9ea4cb', warm: '#ffbe62', flame: '#ffd98c', flameCore: '#fff6dc',
  wood: '#5a3d2f', woodDark: '#3a271f', woodLight: '#8c6048', paper: '#efe4ca', paperDim: '#d8cbac',
  ink: '#2a2130', inkSoft: '#5b4e5c', gold: '#b88a3e', rose: '#b4574f', teal: '#3f8a80', glassAmber: '#e59a3c',
  tea: '#a8531f', leaf: '#5e9a6c', cat: '#8e8aa6', catDark: '#5d5a78',
};
const PALETTE = makePalette({ paper: COL.wall, ink: COL.chalk, night: COL.wallDeep, chalk: COL.chalk, chalkDim: COL.chalkDim, light: COL.paper,
  washBlend: 'source-over', fills: [COL.wood, COL.frame, COL.paper, COL.leaf], accents: [COL.rose, COL.teal, COL.gold, COL.warm], finish: 'flat' }, 'doodlePastel');
usePalette(PALETTE);

// fonts must be decoded before the first frame (core waits on _photoLoads)
_photoLoads.push(document.fonts.load('60px "Amiri Quran"', 'بِسْمِ ٱللَّهِ'), document.fonts.load('700 50px Amiri', 'سورة'),
  document.fonts.load('40px Amiri', 'Focus 0123'), document.fonts.load('italic 30px Amiri', 'session'));
const QF = s => `${s}px "Amiri Quran"`, AF = s => `700 ${s}px Amiri`, LF = s => `${s}px Amiri`, LI = s => `italic ${s}px Amiri`;
const arDigits = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const mmss = sec => { sec = Math.max(0, Math.ceil(sec - 1e-6)); return `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`; };
const T12 = t => Math.floor(t * 12 + 1e-6) / 12;   // living things on twos

// ===================== GEOMETRY OF THE ROOM =====================
const WIN = { x0: 150, x1: 850, ys: 452, yb: 700 };   // arched window: span, spring line, sill
WIN.xm = (WIN.x0 + WIN.x1) / 2; WIN.r = (WIN.x1 - WIN.x0) * .55;
// a pointed (two-centred) arch, offset o outward; returns a closed outline from the bottom-left corner
function archPts(o = 0, yb = WIN.yb) {
  const { x0, x1, ys, xm, r } = WIN, R = r + o, cl = x0 + r, cr = x1 - r, pts = [[x0 - o, yb], [x0 - o, ys]];
  const aTop = Math.acos((xm - cl) / R);            // angle where the left arc meets the centre line
  for (let k = 1; k <= 28; k++) { const a = Math.PI - (Math.PI - aTop) * k / 28; pts.push([cl + R * Math.cos(a), ys - R * Math.sin(a)]); }
  for (let k = 27; k >= 0; k--) { const a = Math.PI - (Math.PI - aTop) * k / 28; pts.push([cr - R * Math.cos(a), ys - R * Math.sin(a)]); }
  pts.push([x1 + o, ys], [x1 + o, yb]); return pts;
}
const apexY = o => WIN.ys - Math.sqrt((WIN.r + o) ** 2 - (WIN.xm - WIN.x0 - WIN.r) ** 2);
const GLASS = polyPath(archPts(0));
const DESK_Y = 812;
const CARD = { x: 1000, y: 58, w: 840, h: 686 };
const NOTE = { cx: 1462, cy: 946, w: 770, h: 228, rot: -.018 };
const LANTERN = { x: 262, y: 858 };   // base centre (it stands on two books)
const FLAME = { x: LANTERN.x, y: LANTERN.y - 118 };
const TEA = { x: 842, y: 968 };
const REHAL = { x: 590, y: 905 };
const CAT = { x: 730, y: 700 };

// ===================== SMALL DRAWING HELPERS =====================
const P = (...xy) => { const out = []; for (let i = 0; i < xy.length; i += 2) out.push([xy[i], xy[i + 1]]); return out; };
const shift = (pts, dx, dy) => pts.map(([x, y]) => [x + dx, y + dy]);
function ellArc(cx, cy, rx, ry, a0, a1, n = 24) { const out = []; for (let k = 0; k <= n; k++) { const a = lerp(a0, a1, k / n); out.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]); } return out; }
function fillPts(c, pts, color, al = 1) { c.save(); c.globalAlpha *= al; c.fillStyle = color; c.fill(polyPath(pts)); c.restore(); }
function text(c, str, x, y, font, color, o = {}) { const { align = 'center', al = 1, rtl = false, base = 'alphabetic', spacing = 0 } = o; c.save(); c.font = font; c.fillStyle = color; c.globalAlpha *= al; c.textAlign = align; c.textBaseline = base; c.direction = rtl ? 'rtl' : 'ltr'; if (spacing) c.letterSpacing = spacing + 'px'; c.fillText(str, x, y); c.restore(); }
function softEllipse(c, x, y, rx, ry, color, al) { c.save(); c.translate(x, y); c.scale(1, ry / rx); const g = c.createRadialGradient(0, 0, 0, 0, 0, rx); g.addColorStop(0, alpha(color, al)); g.addColorStop(1, alpha(color, 0)); c.fillStyle = g; c.beginPath(); c.arc(0, 0, rx, 0, TAU); c.fill(); c.restore(); }
// an 8-pointed star (khatam), the ornament of the card corners and the notebook
function khatam(r) { const pts = []; for (let k = 0; k < 16; k++) { const a = k * Math.PI / 8 - Math.PI / 2, rr = k % 2 ? r * .62 : r; pts.push([Math.cos(a) * rr, Math.sin(a) * rr]); } return pts; }

// ===================== THE STATIC ROOM, AS DOODLES THAT DRAW THEMSELVES =====================
// Each plane is its own doodle so nearer things cover farther lines. start = when its pen begins (intro seconds).
const LINE = { w: 2.6, color: COL.chalk };
const THIN = { w: 1.5, color: COL.chalkDim };

function skyBase(c) {   // behind everything: the night seen through the glass
  resetT(c); c.save(); c.clip(GLASS);
  const g = c.createLinearGradient(0, 70, 0, WIN.yb); g.addColorStop(0, COL.skyTop); g.addColorStop(.72, '#1d2452'); g.addColorStop(1, COL.skyLow); c.fillStyle = g; c.fillRect(0, 0, W, H);
  softEllipse(c, WIN.xm, WIN.yb - 40, 420, 120, '#6f6fb0', .22);          // city haze on the horizon
  grain(c, GLASS, [WIN.x0, 60, WIN.x1 - WIN.x0, WIN.yb], 500, '#c9cff5', .05, 41, 1.4);
  c.restore();
}

// city on the horizon: houses, two domes, two minarets; lit windows come alive separately
const CITY = (() => {
  const r = rng(77), parts = [], lights = []; let x = WIN.x0 - 10;
  while (x < WIN.x1 + 10) { const w = 34 + r() * 46, h = 34 + r() * 70; parts.push({ kind: 'house', x, w, h }); for (let k = 0; k < 3; k++) if (r() < .5) lights.push({ x: x + 7 + r() * (w - 16), y: WIN.yb - 12 - r() * (h - 22), p: 60 + r() * 200, ph: r(), on: r() < .75 ? .82 : 1 }); x += w + 2 + r() * 8; }
  parts.push({ kind: 'dome', x: 265, w: 96, h: 70 }, { kind: 'minaret', x: 222, w: 16, h: 190 }, { kind: 'dome', x: 640, w: 120, h: 86 }, { kind: 'minaret', x: 784, w: 18, h: 225 }, { kind: 'minaret', x: 590, w: 13, h: 150 });
  return { parts, lights };
})();
function cityOutline(p) {
  const b = WIN.yb, { x, w, h } = p;
  if (p.kind === 'house') return P(x, b, x, b - h, x + w, b - h, x + w, b);
  if (p.kind === 'dome') { const drum = h * .45, pts = P(x, b, x, b - drum); pts.push(...ellArc(x + w / 2, b - drum, w / 2, h * .9, Math.PI, TAU, 28)); pts.push(...P(x + w, b - drum, x + w, b)); return pts; }
  // minaret: shaft, balcony, slimmer shaft, cone
  const bal = b - h * .72, top = b - h;
  return P(x, b, x, bal, x - 7, bal, x - 7, bal - 9, x + 2, bal - 9, x + 2, top + 26, x + w / 2, top, x + w - 2, top + 26, x + w - 2, bal - 9, x + w + 7, bal - 9, x + w + 7, bal, x + w, bal, x + w, b);
}
function drawCity(d) {
  for (const p of CITY.parts.filter(q => q.kind === 'house')) { const o = cityOutline(p); d.fill(polyPath(o), COL.city, { al: 1 }); d.line(o, { w: 1.2, color: alpha(COL.chalkDim, .55), smooth: false, speed: 5000 }); }
  d.layer();
  for (const p of CITY.parts.filter(q => q.kind !== 'house')) { const o = cityOutline(p); d.fill(polyPath(o), '#11152d', { al: 1 }); d.line(o, { w: 1.4, color: alpha(COL.chalkDim, .75), smooth: false, speed: 4000 });
    if (p.kind === 'minaret') { const cx = p.x + p.w / 2, top = WIN.yb - p.h; d.line(P(cx, top, cx, top - 12), { w: 1.3, color: COL.chalkDim, smooth: false }); d.line(ellArc(cx + 2, top - 17, 4.5, 4.5, -2.2, 2.2, 10), { w: 1.3, color: COL.chalkDim }); }
    if (p.kind === 'dome') { const cx = p.x + p.w / 2, top = WIN.yb - p.h * .45 - p.h * .9; d.line(P(cx, top, cx, top - 16), { w: 1.3, color: COL.chalkDim, smooth: false }); } }
}

function drawWall(d) {
  d.mark((c, k) => { resetT(c); c.save(); c.globalAlpha *= k;
    const p = new Path2D(); p.rect(0, 0, W, DESK_Y + 4); p.addPath(GLASS);
    c.fillStyle = COL.wall; c.fill(p, 'evenodd');
    const v = c.createLinearGradient(0, 0, 0, DESK_Y); v.addColorStop(0, alpha(COL.wallDeep, .75)); v.addColorStop(.5, alpha(COL.wallDeep, .1)); v.addColorStop(1, alpha(COL.wallDeep, .45)); c.fillStyle = v; c.fill(p, 'evenodd');
    c.clip(p, 'evenodd'); grain(c, rectPath(0, 0, W, DESK_Y), [0, 0, W, DESK_Y], 2600, COL.chalk, .025, 5, 1.6);
    // a faint plaster band with a hand-drawn star pattern, at dado height behind the desk
    c.globalAlpha = .07 * k; c.strokeStyle = COL.chalk; c.lineWidth = 1.2;
    for (let x = 30; x < W; x += 92) { c.save(); c.translate(x, DESK_Y - 44); c.beginPath(); khatam(18).forEach((q, i) => i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1])); c.closePath(); c.stroke(); c.restore(); }
    c.beginPath(); c.moveTo(0, DESK_Y - 78); c.lineTo(W, DESK_Y - 78); c.moveTo(0, DESK_Y - 12); c.lineTo(W, DESK_Y - 12); c.stroke();
    c.restore(); }, .5);
}

function drawWindow(d) {
  const outer = archPts(34, WIN.yb), inner = archPts(0), mid = archPts(14);
  const ring = new Path2D(); ring.addPath(polyPath(outer)); ring.addPath(polyPath(inner));
  d.mark((c, k) => { c.save(); c.globalAlpha *= k; c.fillStyle = COL.frame; c.fill(ring, 'evenodd'); c.restore(); }, .3);
  d.line(outer, { ...LINE, w: 3, speed: 2600 }).line(inner, { ...LINE, w: 2.4, speed: 2600 }).line(mid, { ...THIN, w: 1.1, speed: 3000 });
  // mullion and transom, drawn as narrow frames
  const xm = WIN.xm, top = apexY(0);
  d.fill(polyPath(P(xm - 7, top + 4, xm + 7, top + 4, xm + 7, WIN.yb, xm - 7, WIN.yb)), COL.frame).line(P(xm - 7, top + 6, xm - 7, WIN.yb), { ...LINE, w: 1.8, smooth: false }).line(P(xm + 7, top + 6, xm + 7, WIN.yb), { ...LINE, w: 1.8, smooth: false });
  d.fill(polyPath(P(WIN.x0, WIN.ys - 6, WIN.x1, WIN.ys - 6, WIN.x1, WIN.ys + 6, WIN.x0, WIN.ys + 6)), COL.frame).line(P(WIN.x0, WIN.ys - 6, xm - 7, WIN.ys - 6), { ...LINE, w: 1.8, smooth: false }).line(P(xm + 7, WIN.ys - 6, WIN.x1, WIN.ys - 6), { ...LINE, w: 1.8, smooth: false })
    .line(P(WIN.x0, WIN.ys + 6, xm - 7, WIN.ys + 6), { ...LINE, w: 1.8, smooth: false }).line(P(xm + 7, WIN.ys + 6, WIN.x1, WIN.ys + 6), { ...LINE, w: 1.8, smooth: false });
  // glass sheen
  d.mark((c, k) => { c.save(); c.clip(GLASS); c.globalAlpha *= .06 * k; c.strokeStyle = '#ffffff'; c.lineWidth = 16; c.lineCap = 'round';
    for (const [x, y] of [[250, 520], [290, 520], [610, 300], [650, 300]]) { c.beginPath(); c.moveTo(x, y); c.lineTo(x + 90, y - 110); c.stroke(); } c.restore(); }, .3);
  // sill
  const sill = P(96, WIN.yb, 904, WIN.yb, 918, WIN.yb + 16, 918, WIN.yb + 34, 82, WIN.yb + 34, 82, WIN.yb + 16);
  d.fill(polyPath(sill), '#3b3f69').wash(polyPath(P(82, WIN.yb + 16, 918, WIN.yb + 16, 918, WIN.yb + 34, 82, WIN.yb + 34)), COL.wallDeep, { al: .6, off: 1, seed: 3 })
    .line(sill, { ...LINE, close: true, w: 2.2, smooth: false }).line(P(84, WIN.yb + 16, 916, WIN.yb + 16), { ...THIN, smooth: false });
}

function drawPlant(d) {   // a small potted plant at the left of the sill
  const x = 420, b = WIN.yb;
  const pot = P(x - 34, b - 58, x + 34, b - 58, x + 26, b, x - 26, b);
  const leaves = [[-.9, 70, 16], [-.45, 88, 18], [0, 96, 17], [.45, 84, 18], [.95, 66, 15], [-1.35, 50, 13], [1.35, 48, 13]];
  d.layer();
  for (const [a, L, wd] of leaves) { const ang = -Math.PI / 2 + a * .75, tip = [x + Math.cos(ang) * L, b - 58 + Math.sin(ang) * L], bx = x + Math.cos(ang) * 6, by = b - 60, nx = -Math.sin(ang), ny = Math.cos(ang);
    const mid = [(bx + tip[0]) / 2, (by + tip[1]) / 2], leaf = [[bx, by], [mid[0] + nx * wd, mid[1] + ny * wd], tip, [mid[0] - nx * wd, mid[1] - ny * wd]];
    d.fill(splinePath(leaf), '#2e5a45').wash(splinePath(leaf), COL.leaf, { al: .55, off: 2 }).line(spline(leaf, 5, true), { w: 1.6, color: COL.chalk, close: true, smooth: false }).line([[bx, by], tip], { w: 1, color: alpha(COL.chalk, .6), smooth: false }); }
  d.layer();
  d.fill(polyPath(pot), '#8e4d38').wash(polyPath(P(x - 34, b - 58, x - 8, b - 58, x - 12, b, x - 26, b)), '#5f2f24', { al: .6, off: 1 })
    .line(pot, { ...LINE, close: true, w: 2.1, smooth: false }).line(P(x - 36, b - 46, x + 36, b - 46), { ...LINE, w: 1.6, smooth: false });
}

function drawDesk(d) {
  const top = P(0, DESK_Y, W, DESK_Y, W, H, 0, H);
  d.mark((c, k) => { resetT(c); c.save(); c.globalAlpha *= k; const g = c.createLinearGradient(0, DESK_Y, 0, H); g.addColorStop(0, '#4a3226'); g.addColorStop(.25, COL.wood); g.addColorStop(1, '#3c281f'); c.fillStyle = g; c.fill(polyPath(top));
    // grain: long slow strokes, one path
    const r = rng(12); c.strokeStyle = alpha('#1d120d', .35); c.lineWidth = 1.2; c.beginPath();
    for (let k2 = 0; k2 < 70; k2++) { const y = DESK_Y + 12 + r() * (H - DESK_Y), x = r() * W, L = 180 + r() * 520; c.moveTo(x, y); c.bezierCurveTo(x + L * .3, y + (r() - .5) * 8, x + L * .6, y + (r() - .5) * 8, x + L, y + (r() - .5) * 6); }
    c.stroke(); c.strokeStyle = alpha(COL.woodLight, .18); c.beginPath();
    for (let k2 = 0; k2 < 40; k2++) { const y = DESK_Y + 20 + r() * (H - DESK_Y), x = r() * W, L = 120 + r() * 300; c.moveTo(x, y); c.quadraticCurveTo(x + L / 2, y + (r() - .5) * 6, x + L, y); } c.stroke();
    grain(c, polyPath(top), [0, DESK_Y, W, H - DESK_Y], 1500, '#000', .08, 13, 1.6); c.restore(); }, .5);
  d.line(P(-10, DESK_Y, W + 10, DESK_Y), { ...LINE, w: 2.6, smooth: false, speed: 5000 }).line(P(-10, DESK_Y + 9, W + 10, DESK_Y + 9), { w: 1.2, color: alpha(COL.chalk, .35), smooth: false, speed: 5000 });
}

function drawBooksUnderLantern(d) {
  const x = LANTERN.x, b = LANTERN.y + 34;
  const b1 = P(x - 118, b, x + 110, b, x + 116, b - 18, x - 112, b - 18), b2 = P(x - 100, b - 18, x + 104, b - 18, x + 96, b - 34, x - 96, b - 34);
  d.layer().fill(polyPath(b1), '#2f4a5c').fill(polyPath(b2), '#6b2f33').wash(polyPath(P(x + 80, b, x + 110, b, x + 116, b - 18, x + 86, b - 18)), COL.paper, { al: .8, off: 1 })
    .line(b1, { ...LINE, close: true, w: 2, smooth: false }).line(b2, { ...LINE, close: true, w: 2, smooth: false })
    .line(P(x - 92, b - 9, x + 60, b - 9), { w: 1.1, color: COL.gold, smooth: false }).line(P(x - 80, b - 26, x + 40, b - 26), { w: 1.1, color: COL.gold, smooth: false });
}

// the fanous: hexagonal lantern, pointed cap, ring; coloured glass lit from inside (the light itself is live)
function lanternShape() {
  const x = LANTERN.x, b = LANTERN.y, bw = 64, tw = 74, yT = b - 206, yB = b - 16;
  return { x, b, bw, tw, yT, yB,
    base: P(x - 78, b, x + 78, b, x + 66, b - 16, x - 66, b - 16),
    body: P(x - bw, yB, x + bw, yB, x + tw, yT, x - tw, yT),
    roof: P(x - tw - 12, yT, x + tw + 12, yT, x + 40, yT - 30, x - 40, yT - 30),
    cone: P(x - 40, yT - 30, x + 40, yT - 30, x + 4, yT - 104, x - 4, yT - 104),
    ringY: yT - 118 };
}
function drawLantern(d) {
  const L = lanternShape(), { x, yT, yB } = L;
  d.layer();
  // glass panes: left, centre, right (centre faces us); washes carry the colour, the glow is added live
  const panes = [P(x - L.bw, yB, x - 24, yB, x - 26, yT, x - L.tw, yT), P(x - 24, yB, x + 24, yB, x + 26, yT, x - 26, yT), P(x + 24, yB, x + L.bw, yB, x + L.tw, yT, x + 26, yT)];
  d.fill(polyPath(L.body), '#3a2a22');
  d.wash(polyPath(panes[0]), '#2f7e76', { al: .85, off: 1, seed: 21 }).wash(polyPath(panes[1]), COL.glassAmber, { al: .9, off: 1, seed: 22 }).wash(polyPath(panes[2]), '#a8453c', { al: .85, off: 1, seed: 23 });
  d.line(L.body, { ...LINE, close: true, w: 2.6, smooth: false });
  for (const p of [-24, 24]) d.line(P(x + p, yB, x + p * 1.08, yT), { ...LINE, w: 2, smooth: false });
  // pierced metalwork: pointed arches on the panes
  for (const cx of [x - 47, x, x + 47]) { const w2 = cx === x ? 17 : 12, arch = [...ellArc(cx, yT + 64, w2, 30, Math.PI, 1.5 * Math.PI, 8), [cx, yT + 26], ...ellArc(cx, yT + 64, w2, 30, 1.5 * Math.PI, TAU, 8).slice(1)];
    d.line([[cx - w2, yB - 12], ...arch, [cx + w2, yB - 12]], { w: 1.6, color: alpha('#2a1a12', .9), smooth: false }); }
  d.fill(polyPath(L.base), '#6e5230').line(L.base, { ...LINE, close: true, w: 2.2, smooth: false });
  d.fill(polyPath(L.roof), '#6e5230').line(L.roof, { ...LINE, close: true, w: 2.2, smooth: false });
  d.fill(polyPath(L.cone), '#7d5d36').wash(polyPath(P(x, L.yT - 30, x + 40, L.yT - 30, x + 4, L.yT - 104)), '#3d2a18', { al: .5, off: 1 }).line(L.cone, { ...LINE, close: true, w: 2.2, smooth: false });
  for (let k = 0; k < 5; k++) { const yy = L.yT - 36 - k * 13, hw = 34 - k * 6.5; d.line(P(x - hw, yy, x + hw, yy), { w: 1.1, color: alpha(COL.chalk, .6), smooth: false }); }
  d.line(ellArc(x, L.ringY, 13, 14, 0, TAU, 20), { ...LINE, w: 2.2 });

  return G;
}
function ensureStatic() { init(); if (G.roomReady) return; skyBase(G.skyLayer.getContext('2d')); const g = G.roomLayer.getContext('2d'); resetT(g); for (const d of G.DOODLES) d.draw(g, 1e6); G.roomReady = true; }

function drawSky(c, T, fade) {

// ===================== THE AYAH CARD =====================
const SURAH = Object.fromEntries(ST.surahs.map(s => [s.id, s]));
const segAt = T => { let lo = 0, hi = ST.segs.length - 1, best = -1; while (lo <= hi) { const m = (lo + hi) >> 1; if (ST.segs[m].t0 <= T + 1e-6) { best = m; lo = m + 1; } else hi = m - 1; } return best; };
const BODY = { x: CARD.x + 60, y: CARD.y + 196, w: CARD.w - 120, h: 386 };

// lines of an ayah that fit the body; long ayahs shrink, then split into pages
const _meas = document.createElement('canvas').getContext('2d');
function wrap(words, size, maxW) { _meas.font = QF(size); _meas.direction = 'rtl'; const lines = []; let cur = '';
  for (const w of words) { const tryL = cur ? cur + ' ' + w : w; if (_meas.measureText(tryL).width <= maxW || !cur) cur = tryL; else { lines.push(cur); cur = w; } } if (cur) lines.push(cur); return lines; }

  for (let size = big ? 70 : 60; size >= 40; size -= 2) { const lh = size * 1.9, lines = wrap(words, size, BODY.w); if (lines.length * lh <= BODY.h) return [{ size, lh, lines }]; }

function pageAt(si, T) { const pages = pagesOf(si); if (pages.length === 1) return 0; const s = ST.segs[si], tot = pages.reduce((a, p) => a + p.lines.join(' ').length, 0); let acc = 0; const u = (T - s.t0) / (s.t1 - s.t0) * tot;

function cardHeader(c, title, sub) {

  if (sub) text(c, sub, CARD.w / 2, 196, LI(25), COL.inkSoft, { al: .85 });

    c.strokeStyle = alpha(COL.gold, .95); c.lineWidth = 3; c.beginPath(); c.moveTo(x0, y); c.lineTo(lerp(x0, x1, prog), y); c.stroke(); c.fillStyle = COL.gold; c.beginPath(); c.arc(lerp(x0, x1, prog), y, 5, 0, TAU); c.fill(); c.restore(); }

}
function cardAyahLines(c, pg, color = COL.ink) {

// page content is drawn once into a card-sized layer and reused while it holds
const _pages = new Map();
function cardPage(key, draw) { if (_pages.has(key)) return _pages.get(key); if (_pages.size > 6) _pages.delete(_pages.keys().next().value);
  const L = layer(CARD.w, CARD.h), g = L.getContext('2d'); resetT(g); draw(g); _pages.set(key, L); return L; }

function titlePage(g) {
  cardHeader(g, 'دراسة مع القرآن', 'study with me  ·  1 hour  ·  pomodoro 25 / 5');
  cardAyahLines(g, layoutAyah(ST.opening.text, '۝' + arDigits(ST.opening.a))[0]);
  text(g, `Al-Muzzammil ${ST.opening.s}:${ST.opening.a}  —  “and recite the Qur’an with measured recitation”`, CARD.w / 2, BODY.y - CARD.y + BODY.h - 6, LI(23), COL.inkSoft, { al: .9 });

function ayahPage(si, pageIdx) { return g => { const s = ST.segs[si], su = SURAH[s.s];

  const pages = pagesOf(si).length;
  cardFooter(g, `Sheikh ${ST.reciter} · ${ST.style.toLowerCase()}`, s.a === 0 ? 'bismillah' : `ayah ${s.a} / ${su.verses}${pages > 1 ? `  (${pageIdx + 1}/${pages})` : ''}`, s.a === 0 ? 0 : s.a / su.verses); }; }
function quietPage(g) {
  cardHeader(g, 'صَدَقَ ٱللَّهُ ٱلْعَظِيمُ', 'the recitation is complete — finish your session in quiet');
  text(g, 'keep going, you are almost there', CARD.w / 2, BODY.y - CARD.y + BODY.h / 2 + 10, LI(36), COL.inkSoft);
  cardFooter(g, `Sheikh ${ST.reciter} · ${ST.style.toLowerCase()}`, ST.channel, 1);
}

  text(g, 'may Allah put barakah in your time', CARD.w / 2, BODY.y - CARD.y + 185, LI(32), COL.inkSoft);
  text(g, 'and make your studies easy for you.', CARD.w / 2, BODY.y - CARD.y + 232, LI(32), COL.inkSoft);

// which page shows at time T, and the one before it (for the crossfade)
function cardState(T) {
  if (T < INTRO) return { key: 'title', draw: titlePage, t0: 0 };
  if (T >= S_END) return { key: 'outro', draw: outroPage, t0: S_END };
  const si = segAt(T);

  const p = pageAt(si, T), pages = pagesOf(si); let t0 = s.t0;

}
const FADE_OUT = .22, FADE_IN = .38;
function drawCard(c, T, reveal = 1) {

}

// ===================== THE POMODORO NOTEBOOK =====================
function phaseAt(T) { for (const p of ST.phases) if (T < p.t1) return p; return null; }

  text(c, mmss(remain), 286, 150, LF(92), COL.ink, { align: 'left' });
  text(c, sub, 292, 196, LI(24), COL.inkSoft, { align: 'left' });

    c.fillStyle = alpha(col, .18); c.fillRect(xx + 1, sy, w - 2, sh); c.fillStyle = alpha(col, .85); c.fillRect(xx + 1, sy, (w - 2) * done, sh); c.strokeStyle = alpha(COL.ink, .5); c.lineWidth = 1; c.strokeRect(xx + 1, sy, w - 2, sh); xx += w; }
  const el = clamp(T - INTRO, 0, SESSION);
  text(c, `${Math.floor(el / 60)} min`, sx0, 118, LF(36), COL.ink, { align: 'left' });
  text(c, `of ${Math.round(SESSION / 60)}`, sx1, 118, LI(24), COL.inkSoft, { align: 'right' });
  // a box per focus session, ticked when it is done
  let n = 0; for (const p of ST.phases) if (p.kind === 'focus') { const doneP = T >= p.t1; const cx = sx0 + 12 + n * 38, cy = 168; c.strokeStyle = alpha(COL.ink, .7); c.lineWidth = 1.6; c.strokeRect(cx - 12, cy - 12, 24, 24);
    if (doneP) { c.strokeStyle = COL.rose; c.lineWidth = 3; c.beginPath(); c.moveTo(cx - 8, cy); c.lineTo(cx - 2, cy + 7); c.lineTo(cx + 11, cy - 11); c.stroke(); } n++; }
  text(c, 'sessions', sx1, 176, LI(22), COL.inkSoft, { align: 'right' });
  c.restore();
  // a soft pulse on the dial whenever a phase changes
  const edges = ST.phases.map(p => p.t0).concat([S_END]); const since = Math.min(...edges.map(e => T - e).filter(v => v >= 0).concat([99]));
  if (since < 3 && T > INTRO) { const k = (1 - since / 3); const ca = Math.cos(NOTE.rot), sa = Math.sin(NOTE.rot), X = -NOTE.w / 2 + dx, Y = -NOTE.h / 2 + dy; glow(c, NOTE.cx + X * ca - Y * sa, NOTE.cy + X * sa + Y * ca, 150, accent === COL.teal ? '#7fd6c8' : '#ffb07a', .5 * k * (.6 + .4 * Math.cos(since * 6))); }
}

// ===================== SCENES =====================
function room(c, T, { introTau = null } = {}) {

  else { c.save(); resetT(c); c.fillStyle = COL.wallDeep; c.fillRect(0, 0, W, H); c.restore();
    const skyIn = sm(.2, 1.6, introTau); c.save(); c.globalAlpha = skyIn; blit(c, G.skyLayer); c.restore(); drawSky(c, T, skyIn);
    resetT(c); for (const d of G.DOODLES) d.draw(c, introTau); }
  const lit = introTau === null ? 1 : sm(G.ROOM_DONE - .6, G.ROOM_DONE + 1.2, introTau, easeOut);
  drawCityLights(c, T, introTau === null ? 1 : sm(2, 4, introTau));
  drawCat(c, T, introTau === null ? 1 : sm(2.4, 3.4, introTau));

function sceneIntro(c, tau) {

  drawCard(c, tau, sm(3.4, 5, tau)); drawTimer(c, tau, sm(4.2, 5.8, tau));

function sceneOutro(c, tau) { const T = S_END + tau; room(c, T); drawCard(c, T); drawTimer(c, T);
  c.save(); resetT(c); c.globalAlpha = sm(OUTRO - 1.6, OUTRO, tau); c.fillStyle = '#000'; c.fillRect(0, 0, W, H); c.restore(); }
function sceneThumb(c) {   // YouTube thumbnail: the room at a quiet moment, big lettering on the card
  const T = INTRO + 600; room(c, T);
  const { x, y, w, h } = CARD; c.save(); resetT(c); c.translate(x, y);
  const inner = rectPath(38, 38, w - 76, h - 76); c.fillStyle = COL.paper; c.fill(inner); grain(c, inner, [38, 38, w - 76, h - 76], 900, '#6d5a3a', .07, 19, 1.4);
  text(c, 'STUDY WITH ME', w / 2, 170, LF(90), COL.ink, { spacing: 3 });
  text(c, '1 HOUR · QUR’AN', w / 2, 285, LF(84), COL.rose, { spacing: 3 });
  text(c, 'وَرَتِّلِ ٱلْقُرْءَانَ تَرْتِيلًا', w / 2, 430, QF(72), COL.ink, { rtl: true });
  text(c, 'pomodoro 25/5  ·  Sheikh al-Minshawi', w / 2, 560, LI(40), COL.inkSoft);
  c.restore(); drawTimer(c, INTRO + 18 * 60 + 17);
}

if (QS.has('thumb')) defineFilm({ palette: PALETTE, fps: 12, format: { ar: '16:9', width: 1920 }, timeline: [{ name: 'thumb', dur: 1 / 12, fn: sceneThumb }] });
else defineFilm({ palette: PALETTE, fps: 12, format: { ar: '16:9', width: 1920 }, timeline: [
  { name: 'intro', dur: INTRO, fn: sceneIntro },
  { name: 'study', dur: SESSION, fn: sceneStudy },
  { name: 'outro', dur: OUTRO, fn: sceneOutro },

// JPEG frames for the streaming renderer (PNG is ~6x slower to encode for an hour of frames)
